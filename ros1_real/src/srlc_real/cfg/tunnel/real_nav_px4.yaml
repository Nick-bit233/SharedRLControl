# Real PX4 SRLC policy deployment parameters.

# Policy.
checkpoint_path: ""
action_limit: 2.0
policy_mode: "residual"
device: "cpu"
deterministic: true
policy_debug: false

# LiDAR topic input produced by map_lidar_node.py.
lidar_range_image_topic: "/srlc/lidar/range_image"
lidar_min_distance_topic: "/srlc/lidar/min_distance"
clearance_topic: "/srlc/lidar/obstacle_clearance"
lidar_timeout: 0.3
lidar_range: 4.0
lidar_vbeams: 4
lidar_hres: 10.0

# RC human_action input produced by rc_input_node.py.
human_action_topic: "/srlc/human_action"
human_action_timeout: 0.3
assist_input_deadzone_norm: 0.05

# PX4 control.
control_freq: 20.0
height_control: false
lock_z_control: true
takeoff_height: 1.0
require_offboard: true
real_auto_takeoff_on_offboard: true
post_takeoff_mode: "assist"
takeoff_lower_margin: 0.2
takeoff_upper_margin: 0.2
takeoff_max_abs_vz: 0.25
takeoff_confirm_duration: 0.5
takeoff_timeout: 15.0
takeoff_max_overshoot: 0.5
takeoff_max_xy_drift: 0.5
takeoff_max_climb_speed: 0.4
takeoff_max_vertical_accel: 0.5
takeoff_max_tracking_error: 0.25
input_recovery_grace: 1.0
fault_response: "hold"
fault_land_mode: "AUTO.LAND"
fault_land_confirm_timeout: 2.0
fault_land_retry_interval: 0.5
fault_land_max_attempts: 3
odom_timeout: 0.3
odom_topic: "/nokov/local_position/odom"
px4_local_odom_topic: "/mavros/local_position/odom"
px4_local_velocity_topic: "/mavros/local_position/velocity_local"
setpoint_raw_topic: "/mavros/setpoint_raw/local"

# Conservative real-flight command limits.
max_xy_speed_real: 0.5
max_z_speed_real: 0.3
min_altitude: 0.5
max_altitude: 3.0
geofence_x: [-3.0, 3.0]
geofence_y: [-3.0, 3.0]

# Independent raw-PCD clearance guard. Hard collision confirmation is always on.
enable_proximity_guard: false
proximity_enter_clearance: 0.10
proximity_release_clearance: 0.15
proximity_release_duration: 0.20
proximity_escape_min_speed: 0.05
collision_confirm_clearance: 0.02
collision_confirm_frames: 2
collision_immediate_clearance: -0.03
clearance_guard_mode: "enforce"
