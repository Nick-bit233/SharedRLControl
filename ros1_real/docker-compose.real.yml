services:
  real_runtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: srlc_ros1_real:noetic
    network_mode: host
    ipc: host
    shm_size: 2gb
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
      ROS_MASTER_URI: ${ROS_MASTER_URI:-http://127.0.0.1:11311}
      ROS_IP: ${ROS_IP:-127.0.0.1}
      START_MAVLINK_STREAM_GUARD: ${START_MAVLINK_STREAM_GUARD:-true}
      PX4_FCU_URL: ${PX4_FCU_URL:-udp://:14551@192.168.31.201:14550}
      PX4_GCS_URL: ${PX4_GCS_URL:-}
      NOKOV_SERVER: ${NOKOV_SERVER:-192.168.31.192}
      NOKOV_PORT: ${NOKOV_PORT:-3883}
      NOKOV_TRACKER: ${NOKOV_TRACKER:-uav_soccer}
      MAVLINK_LOCAL_POSITION_RATE_HZ: ${MAVLINK_LOCAL_POSITION_RATE_HZ:-30.0}
      MAVLINK_ATTITUDE_RATE_HZ: ${MAVLINK_ATTITUDE_RATE_HZ:-20.0}
      MAVLINK_STREAM_VERIFY_TIMEOUT_SEC: ${MAVLINK_STREAM_VERIFY_TIMEOUT_SEC:-3.0}
      MAVLINK_STREAM_STALE_TIMEOUT_SEC: ${MAVLINK_STREAM_STALE_TIMEOUT_SEC:-2.0}
      MAVLINK_STREAM_RETRY_INTERVAL_SEC: ${MAVLINK_STREAM_RETRY_INTERVAL_SEC:-2.0}
      MAVLINK_STREAM_MAX_ATTEMPTS: ${MAVLINK_STREAM_MAX_ATTEMPTS:-3}
      SRLC_CHECKPOINT: ${SRLC_CHECKPOINT:-/root/real_assets/ckpts/checkpoint_minrisk_0610.pt}
      SRLC_PCD_FILE: ${SRLC_PCD_FILE:-/root/real_assets/maps/room601/0717_section_resampled_0p05_ascii_aligned_floor_level_z0.pcd}
      SRLC_DEVICE: ${SRLC_DEVICE:-cpu}
      SRLC_POST_TAKEOFF_MODE: ${SRLC_POST_TAKEOFF_MODE:-assist}
      SRLC_TAKEOFF_HEIGHT: ${SRLC_TAKEOFF_HEIGHT:-1.0}
      SRLC_AUTO_TAKEOFF: ${SRLC_AUTO_TAKEOFF:-true}
      SRLC_REQUIRE_OFFBOARD: ${SRLC_REQUIRE_OFFBOARD:-true}
      SRLC_TAKEOFF_LOWER_MARGIN: ${SRLC_TAKEOFF_LOWER_MARGIN:-0.2}
      SRLC_TAKEOFF_UPPER_MARGIN: ${SRLC_TAKEOFF_UPPER_MARGIN:-0.2}
      SRLC_TAKEOFF_MAX_ABS_VZ: ${SRLC_TAKEOFF_MAX_ABS_VZ:-0.25}
      SRLC_TAKEOFF_CONFIRM_DURATION: ${SRLC_TAKEOFF_CONFIRM_DURATION:-0.5}
      SRLC_TAKEOFF_TIMEOUT: ${SRLC_TAKEOFF_TIMEOUT:-15.0}
      SRLC_TAKEOFF_MAX_OVERSHOOT: ${SRLC_TAKEOFF_MAX_OVERSHOOT:-0.5}
      SRLC_TAKEOFF_MAX_XY_DRIFT: ${SRLC_TAKEOFF_MAX_XY_DRIFT:-0.5}
      SRLC_TAKEOFF_MAX_CLIMB_SPEED: ${SRLC_TAKEOFF_MAX_CLIMB_SPEED:-0.4}
      SRLC_TAKEOFF_MAX_VERTICAL_ACCEL: ${SRLC_TAKEOFF_MAX_VERTICAL_ACCEL:-0.5}
      SRLC_TAKEOFF_MAX_TRACKING_ERROR: ${SRLC_TAKEOFF_MAX_TRACKING_ERROR:-0.25}
      SRLC_PX4_LOCAL_ODOM_TOPIC: ${SRLC_PX4_LOCAL_ODOM_TOPIC:-/mavros/local_position/odom}
      SRLC_PX4_LOCAL_VELOCITY_TOPIC: ${SRLC_PX4_LOCAL_VELOCITY_TOPIC:-/mavros/local_position/velocity_local}
      SRLC_INPUT_RECOVERY_GRACE: ${SRLC_INPUT_RECOVERY_GRACE:-1.0}
      SRLC_FAULT_RESPONSE: ${SRLC_FAULT_RESPONSE:-auto_land}
      SRLC_FAULT_LAND_MODE: ${SRLC_FAULT_LAND_MODE:-AUTO.LAND}
      SRLC_FAULT_LAND_CONFIRM_TIMEOUT: ${SRLC_FAULT_LAND_CONFIRM_TIMEOUT:-2.0}
      SRLC_FAULT_LAND_RETRY_INTERVAL: ${SRLC_FAULT_LAND_RETRY_INTERVAL:-0.5}
      SRLC_FAULT_LAND_MAX_ATTEMPTS: ${SRLC_FAULT_LAND_MAX_ATTEMPTS:-3}
      SRLC_SAFETY_ACTIVATION_HEIGHT: ${SRLC_SAFETY_ACTIVATION_HEIGHT:-0.3}
      SRLC_ENABLE_PROXIMITY_HOLD: ${SRLC_ENABLE_PROXIMITY_HOLD:-true}
      SRLC_PROXIMITY_ENTER_DIST: ${SRLC_PROXIMITY_ENTER_DIST:-0.10}
      SRLC_PROXIMITY_RELEASE_DIST: ${SRLC_PROXIMITY_RELEASE_DIST:-0.15}
      SRLC_PROXIMITY_RELEASE_DURATION: ${SRLC_PROXIMITY_RELEASE_DURATION:-0.20}
      SRLC_ENABLE_COLLISION_DETECTION: ${SRLC_ENABLE_COLLISION_DETECTION:-true}
      SRLC_MAP_RESOLUTION: ${SRLC_MAP_RESOLUTION:-0.05}
      SRLC_MAP_INFLATE_X: ${SRLC_MAP_INFLATE_X:-0.10}
      SRLC_MAP_INFLATE_Y: ${SRLC_MAP_INFLATE_Y:-0.10}
      SRLC_MAP_INFLATE_Z: ${SRLC_MAP_INFLATE_Z:-0.10}
      SRLC_MAP_YAW_DEG: ${SRLC_MAP_YAW_DEG:-0.0}
      SRLC_MAP_ORIGIN_X: ${SRLC_MAP_ORIGIN_X:-0.0}
      SRLC_MAP_ORIGIN_Y: ${SRLC_MAP_ORIGIN_Y:-0.0}
      SRLC_MAP_ORIGIN_Z: ${SRLC_MAP_ORIGIN_Z:-0.0}
      SRLC_RECORD: ${SRLC_RECORD:-true}
      SRLC_RVIZ: ${SRLC_RVIZ:-false}
      SRLC_OUTPUT_DIR: ${SRLC_OUTPUT_DIR:-/root/real_outputs}
      SRLC_COLLISION_DIST: ${SRLC_COLLISION_DIST:-0.05}
    volumes:
      - ${SRLC_CKPT_HOST_DIR:-../ros1/ckpts}:/root/real_assets/ckpts:ro
      - ${SRLC_MAP_HOST_DIR:-../ros1/real_maps}:/root/real_assets/maps:ro
      - ${SRLC_OUTPUT_HOST_DIR:-./results}:/root/real_outputs:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ["bash", "-lc", "${SRLC_CONTAINER_COMMAND:-sleep infinity}"]
