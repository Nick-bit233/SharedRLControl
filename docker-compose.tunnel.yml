# =============================================================
# Docker Compose for ROS1 tunnel comparison experiments
#
# Default unattended batch mode is headless: no host DISPLAY and no X11 socket.
# Manual visual debugging is opt-in via the tunnel_debug service/profile.
# =============================================================

x-tunnel-common: &tunnel-common
  build:
    context: .
    dockerfile: Dockerfile.tunnel_comparison
  image: tunnel_comparison:20260415-ipcfix
  runtime: nvidia
  network_mode: host
  shm_size: "2gb"
  pids_limit: 4096
  working_dir: /root/catkin_ws
  restart: "no"
  environment: &tunnel-common-env
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
    QT_X11_NO_MITSHM: "1"
    SLOPE_SOURCE_MOUNT: /root/slope_ws/src
  volumes: &tunnel-common-volumes
    # ROS1 comparison source mounts
    - ./ros1/navigation_runner/scripts:/root/catkin_ws/src/navigation_runner/scripts:rw
    - ./ros1/navigation_runner/cfg:/root/catkin_ws/src/navigation_runner/cfg:rw
    - ./ros1/navigation_runner/launch:/root/catkin_ws/src/navigation_runner/launch:rw
    - ./ros1/navigation_runner/docs:/root/catkin_ws/src/navigation_runner/docs:rw
    - ./isaac-training/data/trajectories_tunnel.h5:/root/catkin_ws/src/navigation_runner/cfg/ckpts/trajectories_tunnel.h5:ro

    # slope_inspection IPC source. Override SLOPE_INSPECTION_HOST_PATH if needed.
    - ${SLOPE_INSPECTION_HOST_PATH:-../slope_inspection}:/root/slope_ws/src:rw

    # RL checkpoints and Gazebo assets
    - ./isaac-training/outputs:/root/catkin_ws/src/navigation_runner/checkpoints:ro
    - ./ros1/uav_simulator/worlds:/root/catkin_ws/src/uav_simulator/worlds:rw

    # Persistent experiment outputs
    - ./ros1/results:/root/results:rw
    - ./ros1/results:/root/catkin_ws/results:rw

services:
  tunnel_batch:
    <<: *tunnel-common
    stdin_open: true
    tty: true
    environment:
      <<: *tunnel-common-env
      TUNNEL_RENDER_MODE: headless
    command: ["bash"]

  tunnel_debug:
    <<: *tunnel-common
    profiles: ["debug"]
    container_name: tunnel_debug
    stdin_open: true
    tty: true
    environment:
      <<: *tunnel-common-env
      DISPLAY: ${DISPLAY:-:1}
      TUNNEL_RENDER_MODE: x11
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./ros1/navigation_runner/scripts:/root/catkin_ws/src/navigation_runner/scripts:rw
      - ./ros1/navigation_runner/cfg:/root/catkin_ws/src/navigation_runner/cfg:rw
      - ./ros1/navigation_runner/launch:/root/catkin_ws/src/navigation_runner/launch:rw
      - ./ros1/navigation_runner/docs:/root/catkin_ws/src/navigation_runner/docs:rw
      - ./isaac-training/data/trajectories_tunnel.h5:/root/catkin_ws/src/navigation_runner/cfg/ckpts/trajectories_tunnel.h5:ro
      - ${SLOPE_INSPECTION_HOST_PATH:-../slope_inspection}:/root/slope_ws/src:rw
      - ./isaac-training/outputs:/root/catkin_ws/src/navigation_runner/checkpoints:ro
      - ./ros1/uav_simulator/worlds:/root/catkin_ws/src/uav_simulator/worlds:rw
      - ./ros1/results:/root/results:rw
      - ./ros1/results:/root/catkin_ws/results:rw
    command: ["bash"]
