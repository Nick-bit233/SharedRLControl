defaults:
  - _self_
  - drone
  - ppo
  - sim
  - user_model

checkpoint: "/workspace/NavRL/isaac-training/wandb/latest-run/files/checkpoint_18000.pt"
headless: False
debug_mode: False
log_output_dir: "./outputs"
device: "cuda:0"
seed: 0

# Environment
env:
  num_envs: 1024 # Number of drones for training
  max_episode_length: 2000
  env_spacing: 8.0 
  num_obstacles: 512
  map_range: [40.0, 40.0, 4.5] # [x, y, z], half extents
  platform_width: 4.0  # 原点周围保持平坦的区域宽度（正方形边长）
  enable_lidar: False

env_dyn:
  num_obstacles: 10 # set to zero if static env is needed
  vel_range: [0.5, 1.5]
  local_range: [5.0, 5.0, 4.5]

global_view: False
viewer:
  eye: [-3., 0., 6.]
  lookat: [0., 0, 1.]
  resolution: [960, 720]
