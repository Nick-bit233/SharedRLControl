algo:
  feature_extractor:
    learning_rate: 1e-4
    dyn_obs_num: 5
  
  actor:
    learning_rate: 1e-4
    clip_ratio: 0.1
    action_limit: 2.0 # m/s
  
  critic:
    learning_rate: 1e-4
    clip_ratio: 0.1
  
  rnn:
    enable: False
    gru_hidden_dim: 256
    gru_num_layers: 1

  entropy_loss_coefficient: 1e-3 # encourage exploration
  training_frame_num: 128
  training_epoch_num: 4
  num_minibatches: 4 # split into N minibatches, use little minibatches so that RNN can learn more frames.