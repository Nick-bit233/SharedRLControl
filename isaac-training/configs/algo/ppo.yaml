algo:
  feature_extractor:
    learning_rate: 1e-4
    dyn_obs_num: 5
  
  actor:
    learning_rate: 1e-4
    clip_ratio: 0.1
    action_limit: 2.0 # m/s
  
  critic:
    learning_rate: 1e-4
    clip_ratio: 0.1
  
  rnn:
    enable: False
    gru_hidden_dim: 256
    gru_num_layers: 1

  # Warmup Phase: 
  # During these iterations, the residual policy scale is 0. (set to 100-200)
  warmup_iterations: 100

  observation_cat_prev_action: False  # whether to concatenate previous action to observation
  entropy_loss_coefficient: 1e-3 # encourage exploration
  # TODO: tune these hyperparameters (to be smaller)
  training_frame_num: 128
  training_epoch_num: 10
  num_minibatches: 16 # split into N minibatches