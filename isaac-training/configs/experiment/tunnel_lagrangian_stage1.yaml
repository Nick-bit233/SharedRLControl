# @package _global_
# Stage 1: Easy — few small obstacles, learn basic flying + constrained avoidance.
# Usage: experiment=tunnel_lagrangian_stage1

defaults:
  - tunnel_lagrangian  # inherit all Lagrangian tunnel settings

env:
  num_obstacles: 50
  obstacle_width_range: [0.4, 0.8]
  obstacle_height_range: [8.0, 16.0]

max_iterations: 12010
save_interval: 500

curriculum:
  enable: False

# Beta distribution: low concentration for broad exploration in early stage
algo:
  min_concentration: 2.0

early_stopping:
  enable: True
  patience: 5
  min_delta: 0.10

wandb:
  name: srlc_tunnel_lagrangian_stage1

hydra:
  run:
    dir: ./outputs/lagrangian_curriculum_stage1/${now:%Y-%m-%d_%H-%M-%S}
