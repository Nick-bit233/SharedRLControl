# @package _global_
# Shared base for paper ablation training.

defaults:
  - tunnel_m2_diverse_pilot

algo:
  policy_mode: residual
  reg_coeff: 0.005
  # 1024 envs keeps the original 256-env total frame budget with 1/4 batches.
  num_minibatches: 64

env:
  num_envs: 1024
  reward:
    enable_following: true
    enable_safety: true
    enable_survival: true
    enable_smoothness: true

curriculum:
  enable: False

early_stopping:
  enable: False

init_checkpoint: null
record_video: False

wandb:
  group: tunnel_ablation

hydra:
  run:
    dir: ./outputs/tunnel_ablation/${now:%Y-%m-%d_%H-%M-%S}

job_name: tunnel_ablation
