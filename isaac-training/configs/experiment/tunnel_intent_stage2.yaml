# @package _global_
# Stage 2: Realistic pilot — full intent/reactive range for main training.
# Usage: experiment=tunnel_intent_stage2

defaults:
  - tunnel_intent

env:
  num_obstacles: 50
  obstacle_width_range: [0.4, 0.8]
  obstacle_height_range: [8.0, 16.0]

# Fine-tuning: lower lr for stability
algo:
  feature_extractor:
    learning_rate: 7e-5
  actor:
    learning_rate: 7e-5
  critic:
    learning_rate: 7e-5

  min_concentration: 2.0

user_model:
  intent:
    alpha_range: [0.35, 0.95]
    wrong_direction_prob_range: [0.0, 0.30]
    tau_perc_range: [0.05, 0.25]
    sigma_perc_range: [0.0, 0.30]
    d_react_range: [0.9, 2.2]

max_iterations: 12010
save_interval: 500

curriculum:
  enable: False

early_stopping:
  enable: True
  patience: 5
  min_delta: 0.10

wandb:
  name: srlc_tunnel_intent_stage2

hydra:
  run:
    dir: ./outputs/tunnel_intent_stage2/${now:%Y-%m-%d_%H-%M-%S}
