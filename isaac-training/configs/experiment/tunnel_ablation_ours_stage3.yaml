# @package _global_
# Ours-Retrain stage 3: residual PPO-Beta policy with full rewards, hard tunnel.

defaults:
  - tunnel_ablation_base

env:
  num_obstacles: 80
  obstacle_width_range: [0.4, 0.9]
  obstacle_height_range: [8.0, 18.0]

algo:
  feature_extractor:
    learning_rate: 5e-5
  actor:
    learning_rate: 5e-5
  critic:
    learning_rate: 5e-5

max_iterations: 5003
eval_interval: 125
save_interval: 250

wandb:
  name: tunnel_ablation_ours_stage3

hydra:
  run:
    dir: ./outputs/tunnel_ablation/ours_retrain/stage3/${now:%Y-%m-%d_%H-%M-%S}

job_name: tunnel_ablation_ours_stage3
