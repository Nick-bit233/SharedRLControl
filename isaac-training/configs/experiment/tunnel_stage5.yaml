# @package _global_
# Stage 5: Final — max density + Phase 2 reg_coeff curriculum.
# Usage: experiment=tunnel_stage5

defaults:
  - tunnel

env:
  num_obstacles: 200
  obstacle_width_range: [0.4, 1.1]
  obstacle_height_range: [4.0, 10.0]

max_iterations: 20010
save_interval: 1000

curriculum:
  enable: True
  check_interval: 50
  ema_alpha: 0.1
  promotion_threshold: 0.90
  demotion_threshold: 0.70
  patience: 3
  initial_reg_coeff: 0.01
  max_reg_coeff: 0.3
  reg_step: 0.03

wandb:
  name: srlc_tunnel_stage5

hydra:
  run:
    dir: ./outputs/curriculum_stage5/${now:%Y-%m-%d_%H-%M-%S}
