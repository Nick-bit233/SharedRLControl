# @package _global_
# Unified hard held-out Isaac eval config for all tunnel ablation checkpoints.

defaults:
  - tunnel_ablation_base

env:
  num_obstacles: 80
  obstacle_width_range: [0.4, 0.9]
  obstacle_height_range: [8.0, 18.0]
  reward:
    enable_following: true
    enable_safety: true
    enable_survival: true
    enable_smoothness: true

algo:
  policy_mode: residual
  feature_extractor:
    learning_rate: 5e-5
  actor:
    learning_rate: 5e-5
  critic:
    learning_rate: 5e-5

record_video: False
eval_visualization: false

wandb:
  name: tunnel_ablation_eval

hydra:
  run:
    dir: ./outputs/tunnel_ablation/eval_runs/${now:%Y-%m-%d_%H-%M-%S}

job_name: tunnel_ablation_eval
