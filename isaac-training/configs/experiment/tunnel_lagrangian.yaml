# @package _global_

env_test_mode: False

# === Environment Configuration ===
runtime:
  # runtime.spec: tunnel_lagrangian
  spec: tunnel_lagrangian

env:
  num_envs: 256
  max_episode_length: 1500
  num_obstacles: 50  # Reduced from 150 for initial training (increase after collision rate drops)
  obstacle_width_range: [0.4, 1.1]
  obstacle_height_range: [8.0, 20.0]
  env_spacing: 8.0
  map_range: [6.0, 12.0, 5.0]  # [x, y, z], half extents -> [y, x, z] in isaacsim coordinates
  platform_width: 4.0
  enable_lidar: True
  enable_task_reward: True
  # Collision is triggered at roughly 0.3m; use a short soft safety buffer
  # instead of the previous 1.5m radius that made cost almost always active.
  safety_collision_radius: 0.3
  safety_cost_radius: 0.8

env_dyn:
  num_obstacles: 0

# === Algorithm Configuration ===
algo:
  rnn:
    enable: False
  training_frame_num: 128 # frames per batch
  
  # === Lagrangian safety constraint + auxiliary residual regularization ===
  # reg_coeff may no longer useful, make following completely driven by reward.
  reg_coeff: 0.0
  use_lagrangian: True
  cost_limit: 0.05
  lambda_init: 0.5
  lambda_lr: 1e-3
  lambda_min: 0.0
  lambda_max: 10.0
  fixed_cost_coeff: 0.0

# === Training Loop ===
max_iterations: 20010
eval_interval: 1000
save_interval: 1000
init_checkpoint: null
resume_checkpoint: null

# === Optional residual-reg curriculum (disabled by default for this experiment) ===
curriculum:
  enable: False
  check_interval: 50
  ema_alpha: 0.1
  promotion_threshold: 0.90
  demotion_threshold: 0.70
  patience: 3
  initial_reg_coeff: 0.01
  max_reg_coeff: 0.3
  reg_step: 0.03

# === Early Stopping (restore best checkpoint on performance degradation) ===
early_stopping:
  enable: True
  patience: 5       # consecutive eval drops before stopping
  min_delta: 0.10   # success rate drop from best that counts as degradation

# === User Model ===
user_model:
  # Align 04s with experiment 04 M2: use the tunnel-targeted offline
  # diverse-pilot dataset generated by trajectory_gen_tunnel.yaml.
  offline_mode: true
  dataset_path: ${hydra:runtime.cwd}/data/trajectories_tunnel.h5
  sampling_mode: scaled
  gpu_cache_reserve_gb: 2.0
  min_scale_factor: 0.5
  preload_data: true

  style:
    frequency_base: 0.1  # base frequency for user command changes
    frequency_scale: 0.3  # scale for randomizing frequency

  simple_mode: False
  z_tilt_compensation: 0.0

# === Visualization ===
record_video: True
global_view: True
viewer:
  eye: [0., 0., 3.]
  lookat: [0., 0, 1.]
  resolution: [960, 720]

# === Logging ===
hydra:
  run:
    dir: ./outputs/tunnel_lagrangian/${now:%Y-%m-%d_%H-%M-%S}

# === wandb Configuration ===
wandb:
  project: SRLC
  name: srlc_tunnel_lagrangian
  group: null
  mode: online

job_name: tunnel_lagrangian
