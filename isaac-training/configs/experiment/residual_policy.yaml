# @package _global_

# Experiment specific overrides moved from train.py
env:
  num_envs: 512
  max_episode_length: 2000
  num_obstacles: 300
  env_spacing: 8.0
  map_range: [20.0, 20.0, 5.0]  # [x, y, z], half extents
  platform_width: 4.0  # 原点周围保持平坦的区域宽度（正方形边长）
  enable_lidar: True

env_dyn:
  num_obstacles: 0
  vel_range: [0.5, 1.5]
  local_range: [5.0, 5.0, 5.0]

algo:
  rnn:
    enable: False
  training_frame_num: 128 # frames per batch

global_view: True
viewer:
  eye: [0., 0., 3.]
  lookat: [0., 0, 1.]
  resolution: [960, 720]

# Custom training loop parameters
max_iterations: 50010 # Total number of batches
eval_interval: 500
save_interval: 500

# Overrides for user model
user_model:
  simple_mode: false
  z_tilt_compensation: 0.0

hydra:
  run:
    dir: ./outputs/residual_policy/${now:%Y-%m-%d_%H-%M-%S}

job_name: residual_policy
