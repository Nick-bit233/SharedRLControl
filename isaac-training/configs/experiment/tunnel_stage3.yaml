# @package _global_
# Stage 3: Hard — more obstacles, slightly wider range.
# Usage: experiment=tunnel_stage3

defaults:
  - tunnel

env:
  num_obstacles: 80
  obstacle_width_range: [0.4, 0.9]
  obstacle_height_range: [8.0, 18.0]

# Further reduced lr for fine-tuning
algo:
  feature_extractor:
    learning_rate: 5e-5
  actor:
    learning_rate: 5e-5
  critic:
    learning_rate: 5e-5

  min_concentration: 2.0  # Keep low to allow exploration, avoid timeout

max_iterations: 20010
save_interval: 1000

# Phase 2: reg_coeff curriculum (activated in final stage)
curriculum:
  enable: True
  check_interval: 50
  ema_alpha: 0.1
  promotion_threshold: 0.90
  demotion_threshold: 0.70
  patience: 5
  initial_reg_coeff: 0.01
  max_reg_coeff: 0.05
  reg_step: 0.005

early_stopping:
  enable: True
  patience: 8
  min_delta: 0.10

wandb:
  name: srlc_tunnel_stage3

hydra:
  run:
    dir: ./outputs/curriculum_stage3/${now:%Y-%m-%d_%H-%M-%S}
