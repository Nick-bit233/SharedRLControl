# @package _global_
# Stage 3: Hard — more obstacles, slightly wider range.
# Usage: experiment=tunnel_stage3

defaults:
  - tunnel

env:
  num_obstacles: 80
  obstacle_width_range: [0.4, 0.9]
  obstacle_height_range: [4.0, 9.0]

# Further reduced lr for fine-tuning
algo:
  feature_extractor:
    learning_rate: 5e-5
  actor:
    learning_rate: 5e-5
  critic:
    learning_rate: 5e-5

max_iterations: 10010
save_interval: 500

curriculum:
  enable: False

early_stopping:
  enable: True
  patience: 5
  min_delta: 0.10

wandb:
  name: srlc_tunnel_stage3

hydra:
  run:
    dir: ./outputs/curriculum_stage3/${now:%Y-%m-%d_%H-%M-%S}
