# @package _global_
# Stage 3: Hard — standard density, full-height obstacles.
# Usage: experiment=tunnel_stage3

defaults:
  - tunnel

env:
  num_obstacles: 100
  obstacle_width_range: [0.4, 1.0]
  obstacle_height_range: [4.0, 10.0]

max_iterations: 5010
save_interval: 500

curriculum:
  enable: False

wandb:
  name: srlc_tunnel_stage3

hydra:
  run:
    dir: ./outputs/curriculum_stage3/${now:%Y-%m-%d_%H-%M-%S}
