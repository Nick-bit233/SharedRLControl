# @package _global_
# NoResidual stage 3: direct PPO-Beta policy, hard tunnel.

defaults:
  - tunnel_ablation_base

env:
  num_obstacles: 80
  obstacle_width_range: [0.4, 0.9]
  obstacle_height_range: [8.0, 18.0]

algo:
  policy_mode: direct
  feature_extractor:
    learning_rate: 5e-5
  actor:
    learning_rate: 5e-5
  critic:
    learning_rate: 5e-5

max_iterations: 5003
eval_interval: 125
save_interval: 250

wandb:
  name: tunnel_ablation_no_residual_stage3

hydra:
  run:
    dir: ./outputs/tunnel_ablation/no_residual/stage3/${now:%Y-%m-%d_%H-%M-%S}

job_name: tunnel_ablation_no_residual_stage3
