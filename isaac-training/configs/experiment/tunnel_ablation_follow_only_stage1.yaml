# @package _global_
# FollowOnly stage 1: following reward enabled, local safety reward disabled.

defaults:
  - tunnel_ablation_base

env:
  num_obstacles: 30
  obstacle_width_range: [0.4, 0.8]
  obstacle_height_range: [8.0, 16.0]
  reward:
    enable_safety: false

max_iterations: 3003
eval_interval: 125
save_interval: 125

wandb:
  name: tunnel_ablation_follow_only_stage1

hydra:
  run:
    dir: ./outputs/tunnel_ablation/follow_only/stage1/${now:%Y-%m-%d_%H-%M-%S}

job_name: tunnel_ablation_follow_only_stage1
