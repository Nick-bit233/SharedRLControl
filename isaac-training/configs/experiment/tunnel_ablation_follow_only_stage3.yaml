# @package _global_
# FollowOnly stage 3: following reward enabled, local safety reward disabled.

defaults:
  - tunnel_ablation_base

env:
  num_obstacles: 80
  obstacle_width_range: [0.4, 0.9]
  obstacle_height_range: [8.0, 18.0]
  reward:
    enable_safety: false

algo:
  feature_extractor:
    learning_rate: 5e-5
  actor:
    learning_rate: 5e-5
  critic:
    learning_rate: 5e-5

max_iterations: 5003
eval_interval: 125
save_interval: 250

wandb:
  name: tunnel_ablation_follow_only_stage3

hydra:
  run:
    dir: ./outputs/tunnel_ablation/follow_only/stage3/${now:%Y-%m-%d_%H-%M-%S}

job_name: tunnel_ablation_follow_only_stage3
