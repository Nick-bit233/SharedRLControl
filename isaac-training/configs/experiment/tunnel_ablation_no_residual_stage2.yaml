# @package _global_
# NoResidual stage 2: direct PPO-Beta policy, medium tunnel.

defaults:
  - tunnel_ablation_base

env:
  num_obstacles: 50
  obstacle_width_range: [0.4, 0.8]
  obstacle_height_range: [8.0, 16.0]

algo:
  policy_mode: direct
  feature_extractor:
    learning_rate: 7e-5
  actor:
    learning_rate: 7e-5
  critic:
    learning_rate: 7e-5

max_iterations: 3003
eval_interval: 125
save_interval: 125

wandb:
  name: tunnel_ablation_no_residual_stage2

hydra:
  run:
    dir: ./outputs/tunnel_ablation/no_residual/stage2/${now:%Y-%m-%d_%H-%M-%S}

job_name: tunnel_ablation_no_residual_stage2
