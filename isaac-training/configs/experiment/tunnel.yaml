# @package _global_

env_test_mode: False

# === Environment Configuration ===
env:
  num_envs: 256
  max_episode_length: 1000
  num_obstacles: 50  # Reduced from 150 for initial training (increase after collision rate drops)
  env_spacing: 8.0
  map_range: [6.0, 12.0, 5.0]  # [x, y, z], half extents -> [y, x, z] in isaacsim coordinates
  platform_width: 4.0
  enable_lidar: True
  enable_task_reward: False

env_dyn:
  num_obstacles: 0

# === Algorithm Configuration ===
algo:
  rnn:
    enable: False
  training_frame_num: 128 # frames per batch
  
  # === Constrained Optimization Parameters ===
  # Collision-rate-based constraint: directly target episode-level crash rate.
  # Lambda increases when collision_rate > target, decreases when < target.
  # Much more interpretable than reward-based thresholds.
  # 0.05 = target 5% collision rate (95% avoidance)
  # Start with 0.1 (lenient) and decrease to 0.02-0.05 as training progresses
  target_collision_rate: 0.05
  lambda_lr: 3e-4  # Increased from 1e-4 for faster lambda response

# === Training Loop ===
max_iterations: 10010
eval_interval: 500
save_interval: 500

# === User Model ===
user_model:

  style:
    frequency_base: 0.1  # base frequency for user command changes
    frequency_scale: 0.3  # scale for randomizing frequency

  simple_mode: False
  z_tilt_compensation: 0.0

# === Visualization ===
record_video: True
global_view: True
viewer:
  eye: [0., 0., 3.]
  lookat: [0., 0, 1.]
  resolution: [960, 720]

# === Logging ===
hydra:
  run:
    dir: ./outputs/tunnel/${now:%Y-%m-%d_%H-%M-%S}

job_name: tunnel
