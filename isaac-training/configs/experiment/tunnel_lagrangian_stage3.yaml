# @package _global_
# Stage 3: Hard — more obstacles, slightly wider range.
# Usage: experiment=tunnel_lagrangian_stage3

defaults:
  - tunnel_lagrangian

env:
  num_obstacles: 80
  obstacle_width_range: [0.4, 0.9]
  obstacle_height_range: [8.0, 20.0]

# Further reduced lr for fine-tuning
algo:
  feature_extractor:
    learning_rate: 5e-5
  actor:
    learning_rate: 5e-5
  critic:
    learning_rate: 5e-5

  min_concentration: 2.0  # Keep low to allow exploration, avoid timeout

max_iterations: 20010
save_interval: 1000

curriculum:
  enable: False

early_stopping:
  enable: True
  patience: 8
  min_delta: 0.10

wandb:
  name: srlc_tunnel_lagrangian_stage3

hydra:
  run:
    dir: ./outputs/lagrangian_curriculum_stage3/${now:%Y-%m-%d_%H-%M-%S}
