# @package _global_
# Stage 3: Adversarial pilot — stronger misreaction and higher intervention pressure.
# Usage: experiment=tunnel_intent_stage3

defaults:
  - tunnel_intent

env:
  num_obstacles: 80
  obstacle_width_range: [0.4, 0.9]
  obstacle_height_range: [8.0, 18.0]

# Further reduced lr for fine-tuning
algo:
  feature_extractor:
    learning_rate: 5e-5
  actor:
    learning_rate: 5e-5
  critic:
    learning_rate: 5e-5

  min_concentration: 2.0  # Keep low to allow exploration, avoid timeout

user_model:
  intent:
    alpha_range: [0.10, 0.80]
    wrong_direction_prob_range: [0.15, 0.45]
    tau_perc_range: [0.10, 0.35]
    sigma_perc_range: [0.10, 0.40]
    d_react_range: [0.7, 1.8]

max_iterations: 20010
save_interval: 1000

# Phase 2: reg_coeff curriculum (activated in final stage)
curriculum:
  enable: True
  check_interval: 50
  ema_alpha: 0.1
  promotion_threshold: 0.82
  demotion_threshold: 0.70
  patience: 5
  initial_reg_coeff: 0.01
  max_reg_coeff: 0.05
  reg_step: 0.005

early_stopping:
  enable: True
  patience: 8
  min_delta: 0.10

wandb:
  name: srlc_tunnel_intent_stage3

hydra:
  run:
    dir: ./outputs/tunnel_intent_stage3/${now:%Y-%m-%d_%H-%M-%S}
