# @package _global_
# SafetyRegOnly stage 1: safety reward + residual regularization, no following reward.

defaults:
  - tunnel_ablation_base

env:
  num_obstacles: 30
  obstacle_width_range: [0.4, 0.8]
  obstacle_height_range: [8.0, 16.0]
  reward:
    enable_following: false
    enable_safety: true

max_iterations: 3003
eval_interval: 125
save_interval: 125

wandb:
  name: tunnel_ablation_safety_reg_stage1

hydra:
  run:
    dir: ./outputs/tunnel_ablation/safety_reg/stage1/${now:%Y-%m-%d_%H-%M-%S}

job_name: tunnel_ablation_safety_reg_stage1
