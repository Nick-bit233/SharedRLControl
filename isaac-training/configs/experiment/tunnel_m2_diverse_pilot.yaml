# @package _global_
# === M2: Feasible-but-Diverse Pilot Distribution ===
# Goal: address reviewer concerns about pilot generalization by training
# on a wider distribution of feasible pilot inputs (forward-biased + diverse vy)
# instead of the fixed forward-vx + lateral-noise online model in
# `src/core/user_model_tunnely.py`.
#
# Prereq: generate the tunnel-targeted dataset first
#   python src/datasets/trajectory_generator.py --config-name trajectory_gen_tunnel
# (or use experiments/04_tunnel_task/run_m2_diverse_pilot.py which does
# the generation step automatically when the file is missing).
#
# Usage:
#   python experiments/04_tunnel_task/train.py experiment=tunnel_m2_diverse_pilot \\
#       algo.reg_coeff=0.0     # set to whatever M1 selected as the new mainline

defaults:
  - tunnel

env:
  num_obstacles: 50
  obstacle_width_range: [0.4, 0.8]
  obstacle_height_range: [8.0, 16.0]

algo:
  feature_extractor:
    learning_rate: 5e-5
  actor:
    learning_rate: 5e-5
  critic:
    learning_rate: 5e-5
  min_concentration: 2.0
  # Default to no-reg; override via CLI to inherit the M1-selected reg.
  reg_coeff: 0.0

max_iterations: 20010    # Longer than M1: M2 trains from scratch by default,
                         # so it needs more iterations to learn obstacle avoidance
                         # in addition to the new diverse pilot distribution.
eval_interval: 500
save_interval: 1000
# Default null = train from scratch (recommended main-line for the M2
# generalization claim). Warm-starting from the paper-best checkpoint is
# possible via run_m2_diverse_pilot.py --resume-from, but it should only
# be reported as a secondary "adaptation speed" comparison because that
# checkpoint was trained on the narrow online pilot distribution and its
# feature extractor carries narrow-distribution priors.
resume_checkpoint: null

# Same fair-comparison stance as M1 — only the pilot distribution varies.
curriculum:
  enable: False

early_stopping:
  enable: False

# === Switch to offline trajectory dataset (feasible-but-diverse pilot) ===
user_model:
  offline_mode: true
  dataset_path: ${hydra:runtime.cwd}/data/trajectories_tunnel.h5
  sampling_mode: scaled        # boundary-aware, keeps tunnel feasibility
  gpu_cache_reserve_gb: 2.0
  min_scale_factor: 0.5
  preload_data: true

record_video: False

wandb:
  name: tunnel_m2_diverse_pilot
  group: tunnel_m2_diverse_pilot

hydra:
  run:
    dir: ./outputs/tunnel_m2_diverse_pilot/${now:%Y-%m-%d_%H-%M-%S}

job_name: tunnel_m2_diverse_pilot
