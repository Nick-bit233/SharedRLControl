# @package _global_
# SafetyRegOnly stage 2: safety reward + residual regularization, no following reward.

defaults:
  - tunnel_ablation_base

env:
  num_obstacles: 50
  obstacle_width_range: [0.4, 0.8]
  obstacle_height_range: [8.0, 16.0]
  reward:
    enable_following: false
    enable_safety: true

algo:
  feature_extractor:
    learning_rate: 7e-5
  actor:
    learning_rate: 7e-5
  critic:
    learning_rate: 7e-5

max_iterations: 3003
eval_interval: 125
save_interval: 125

wandb:
  name: tunnel_ablation_safety_reg_stage2

hydra:
  run:
    dir: ./outputs/tunnel_ablation/safety_reg/stage2/${now:%Y-%m-%d_%H-%M-%S}

job_name: tunnel_ablation_safety_reg_stage2
