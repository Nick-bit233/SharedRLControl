# @package _global_
# SafetyRegOnly stage 3: safety reward + residual regularization, no following reward.

defaults:
  - tunnel_ablation_base

env:
  num_obstacles: 80
  obstacle_width_range: [0.4, 0.9]
  obstacle_height_range: [8.0, 18.0]
  reward:
    enable_following: false
    enable_safety: true

algo:
  feature_extractor:
    learning_rate: 5e-5
  actor:
    learning_rate: 5e-5
  critic:
    learning_rate: 5e-5

max_iterations: 5003
eval_interval: 125
save_interval: 250

wandb:
  name: tunnel_ablation_safety_reg_stage3

hydra:
  run:
    dir: ./outputs/tunnel_ablation/safety_reg/stage3/${now:%Y-%m-%d_%H-%M-%S}

job_name: tunnel_ablation_safety_reg_stage3
