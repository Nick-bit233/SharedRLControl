# @package _global_
# === M1: No-Reg / Tiny-Reg Mainline Sweep ===
# Goal: test whether removing or shrinking the residual reg_loss
# (motivated by Schaff & Walter / Residual Policy Learning lineage)
# improves tunnel performance without hurting safety.
#
# Usage:
#   python experiments/train.py experiment=tunnel_m1_noreg \
#       algo.reg_coeff=0.0
#
# This config inherits from `tunnel.yaml` but explicitly disables
# the reg_coeff curriculum and early stopping so each sweep run is
# trained for the same number of iterations on the same distribution.

defaults:
  - tunnel

env:
  num_obstacles: 50
  obstacle_width_range: [0.4, 0.8]
  obstacle_height_range: [8.0, 20.0]

# Match Stage 3 fine-tune-style learning rates so the sweep starts close
# to the paper-current operating point and isolates the reg_coeff effect.
algo:
  feature_extractor:
    learning_rate: 5e-5
  actor:
    learning_rate: 5e-5
  critic:
    learning_rate: 5e-5
  min_concentration: 2.0
  reg_coeff: 0.0   # overridden per-run by run_m1_noreg_sweep.py

max_iterations: 6010
eval_interval: 500
save_interval: 1000
resume_checkpoint: null   # set via CLI to warm-start from the paper-best

# Disable both curriculum and early stopping so every sweep run is
# trained for the same number of iterations under the same setting.
curriculum:
  enable: False

early_stopping:
  enable: False

record_video: False

wandb:
  name: tunnel_m1_noreg
  group: tunnel_m1_noreg

hydra:
  run:
    dir: ./outputs/tunnel_m1_noreg/${now:%Y-%m-%d_%H-%M-%S}

job_name: tunnel_m1_noreg
