# @package _global_

campaign:
  name: safety_shield_curriculum
  mode: train_stages
  checkpoint_policy: best
  checkpoint_override: init_checkpoint
  output_root: ./outputs/campaign/safety_shield_curriculum
  stages:
    - name: stage1
      overrides:
        - experiment=safety_shield
        - env.num_obstacles=60
        - env.obstacle_width_range=[0.4,0.8]
        - env.obstacle_height_range=[4.0,12.0]
        - max_iterations=6010
        - save_interval=500
        - curriculum.enable=false
        - algo.min_concentration=2.0
        - early_stopping.enable=true
        - early_stopping.patience=5
        - early_stopping.min_delta=0.10
        - wandb.name=srlc_shield_stage1
        - job_name=shield_stage1
    - name: stage2
      init_from_previous: true
      overrides:
        - experiment=safety_shield
        - env.num_obstacles=120
        - env.obstacle_width_range=[0.4,0.9]
        - env.obstacle_height_range=[5.0,12.0]
        - algo.feature_extractor.learning_rate=5e-5
        - algo.actor.learning_rate=5e-5
        - algo.critic.learning_rate=5e-5
        - algo.min_concentration=2.0
        - max_iterations=8010
        - save_interval=500
        - curriculum.enable=false
        - early_stopping.enable=true
        - early_stopping.patience=5
        - early_stopping.min_delta=0.10
        - wandb.name=srlc_shield_stage2
        - job_name=shield_stage2
    - name: stage3
      init_from_previous: true
      overrides:
        - experiment=safety_shield
        - env.num_obstacles=200
        - env.obstacle_width_range=[0.4,1.1]
        - env.obstacle_height_range=[6.0,12.0]
        - algo.feature_extractor.learning_rate=3e-5
        - algo.actor.learning_rate=3e-5
        - algo.critic.learning_rate=3e-5
        - algo.min_concentration=5.0
        - max_iterations=10010
        - save_interval=500
        - curriculum.enable=true
        - curriculum.check_interval=50
        - curriculum.ema_alpha=0.1
        - curriculum.promotion_threshold=0.85
        - curriculum.demotion_threshold=0.60
        - curriculum.patience=5
        - curriculum.initial_reg_coeff=0.01
        - curriculum.max_reg_coeff=0.05
        - curriculum.reg_step=0.005
        - early_stopping.enable=true
        - early_stopping.patience=8
        - early_stopping.min_delta=0.10
        - wandb.name=srlc_shield_stage3
        - job_name=shield_stage3
