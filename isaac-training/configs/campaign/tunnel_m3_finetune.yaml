# @package _global_

campaign:
  name: tunnel_m3_finetune
  mode: train_stages
  checkpoint_policy: best
  checkpoint_override: init_checkpoint
  output_root: ./outputs/campaign/tunnel_m3_finetune
  stages:
    - name: finetune
      overrides:
        - experiment=tunnel
        - env.num_obstacles=50
        - env.obstacle_width_range=[0.4,0.8]
        - env.obstacle_height_range=[8.0,16.0]
        - algo.feature_extractor.learning_rate=2.5e-5
        - algo.actor.learning_rate=2.5e-5
        - algo.critic.learning_rate=2.5e-5
        - algo.entropy_loss_coefficient=5e-4
        - algo.min_concentration=2.0
        - algo.reg_coeff=0.005
        - max_iterations=22010
        - eval_interval=250
        - save_interval=250
        - resume_checkpoint=${hydra:runtime.cwd}/outputs/tunnel_m2_diverse_pilot/tunnel_m2_20260423_070951/2026-04-23_07-09-54/wandb/run-20260423_071004-kdtyh522/files/checkpoint_14000.pt
        - curriculum.enable=false
        - early_stopping.enable=false
        - user_model.offline_mode=true
        - user_model.dataset_path=${hydra:runtime.cwd}/data/trajectories_tunnel.h5
        - user_model.sampling_mode=scaled
        - user_model.gpu_cache_reserve_gb=2.0
        - user_model.min_scale_factor=0.5
        - user_model.preload_data=true
        - record_video=false
        - wandb.name=tunnel_m3_finetune
        - job_name=tunnel_m3_finetune
