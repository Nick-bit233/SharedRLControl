# @package _global_

campaign:
  name: tunnel_ablation_no_curriculum
  mode: train_stages
  checkpoint_policy: best
  checkpoint_override: init_checkpoint
  output_root: ./outputs/campaign/tunnel_ablation_no_curriculum
  stages:
    - name: train
      overrides:
        - experiment=tunnel
        - env.num_envs=1024
        - env.num_obstacles=80
        - env.obstacle_width_range=[0.4,0.9]
        - env.obstacle_height_range=[8.0,18.0]
        - env.reward.enable_following=true
        - env.reward.enable_safety=true
        - env.reward.enable_survival=true
        - env.reward.enable_smoothness=true
        - algo.policy_mode=residual
        - algo.reg_coeff=0.005
        - algo.num_minibatches=64
        - algo.feature_extractor.learning_rate=5e-5
        - algo.actor.learning_rate=5e-5
        - algo.critic.learning_rate=5e-5
        - algo.min_concentration=2.0
        - max_iterations=11009
        - eval_interval=125
        - save_interval=250
        - curriculum.enable=false
        - early_stopping.enable=false
        - record_video=false
        - wandb.name=tunnel_ablation_no_curriculum
        - wandb.group=tunnel_ablation
        - job_name=tunnel_ablation_no_curriculum
