# Real scanned-map inference defaults.
# The launch wrapper exposes these as args so they can be tuned per merged map.

real_map: "$(find navigation_runner)/../real_maps/merged/real_map_merged_ascii.pcd"
tunnel_world: "$(find uav_simulator)/worlds/test/empty.world"
map_frame: "map"

# Tune after inspecting the merged map's free space and desired flight direction.
spawn: [-10.0, 0.0, 0.1]
goal_x: 8.0
takeoff_height: 5.0

collision_dist: 0.05
safety_min_dist: 0.2
safety_mode: "hold"
