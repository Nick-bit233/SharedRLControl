# ============================================================
# Tunnel RL policy deployment parameters
# Loaded by tunnel_comparison.launch into /tunnel_navigator/ namespace
# Override from CLI: roslaunch ... checkpoint:=/path/to/model.pt
# ============================================================

# --- Policy (must match training) ---
checkpoint_path: "/root/catkin_ws/src/navigation_runner/cfg/ckpts/checkpoint_tunnel_M3_21500.pt"           # Overridden by launch file; set here only for manual rosrun
action_limit: 2.0             # m/s, must match training config
device: "cpu"                 # "cpu" or "cuda:0"
deterministic: true           # true = use mean action (no sampling noise)

# --- LiDAR sensor (must match training config exactly) ---
lidar_range: 4.0              # metres
lidar_vfov: [-10.0, 20.0]    # vertical FoV [min_deg, max_deg]
lidar_vbeams: 4               # number of vertical beams
lidar_hres: 10.0              # horizontal resolution in degrees → 36 beams
# PCD-based Python raycaster (bypasses C++ occupancy_map which corrupts prebuilt maps)
use_pcd_raycast: true
pcd_file: ""                  # set by launch file via tunnel_map arg

# --- Control ---
control_freq: 20.0            # Hz (training ~60Hz; 20Hz is sufficient for deployment)
use_px4: false                # true for PX4/MAVROS, false for CERLAB Gazebo
height_control: true          # true = 3D velocity, false = hold takeoff_height
takeoff_height: 5.0           # metres — must match training init height (env_tunnel.py: z=5.0)

# --- User model / keyboard mode ---
keyboard_mode: false              # true = keyboard teleop as human input; false = UserModelTunnel
user_model_simple: false       # true = constant forward speed; false = Perlin noise
user_model_profile: "m3_diverse" # m3_diverse | legacy_perlin | simple
user_model_speed: 2.0         # m/s forward speed
user_model_freq_base: 0.1     # Perlin noise base frequency (online mode only)
user_model_freq_scale: 0.2    # M3 diverse-pilot frequency scale
user_model_vx_bias: 1.5       # M3 directional-bias forward component
user_model_vx_amp: 0.5        # M3 vx variation: 1.5 +/- 0.5
user_model_vy_amp: 2.0        # M3 broad lateral pilot diversity
user_model_vz_amp: 0.0        # keep Gazebo main run altitude-neutral
user_model_smoothness_base: 0.4
user_model_smoothness_scale: 0.5
user_model_laziness: 0.3
user_model_seed: 288           # deterministic seed shared with IPC comparison input

# --- Safety ---
use_safety_shield: false      # Use ORCA safe_action_node
safety_min_dist: 0.2          # Emergency stop distance (metres) — training collision=0.3m
collision_dist: 0.05          # Below this = collision = task failed (metres)
safety_start_takeoff_delta: 0.5  # Enable safety monitor after takeoff clears ground

# --- Gazebo deployment ---
# These only apply when use_px4=false (CERLAB Gazebo plugin).
gazebo_max_hvel: 2.0          # m/s max horizontal cmd_vel (match training action_limit)
alt_hold_kp: 1.5              # P-gain for altitude hold
alt_hold_max_vz: 2.0          # max vertical velocity for altitude hold
tumble_deg: 45.0              # roll/pitch threshold for tumble detection (degrees)
tumble_recover_height: 1.0    # metres above takeoff_height during tumble recovery
tumble_recover_timeout: 10.0  # seconds before declaring tumble recovery failed

# --- Goal ---
goal_x: 11.9                  # metres — declare success when drone x >= this
