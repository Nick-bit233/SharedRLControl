#-- IPC parameters tuned for CERLAB Gazebo tunnel experiment --#
# Based on slope_inspection/IPC/config/param_gazebo.yaml
# Adjusted: vel limits match RL action_limit=2.0, map sizes fit tunnel

fsm:
  simulation:    true
  gazebo_flag:   true
  frequency:     100.0
  ctrl_delay:    0.0
  sfc_dis:       0.3
  vel_ref:       2.0       # match RL action_limit
  path_dis:      0.1
  bodyrate_flag: true
  thrust_limit:  1.0
  hover_esti:    false
  hover_perc:    0.7085
  esti_log_flag: false
  esti_R:        0.3
  yaw_ctrl_flag: true
  yaw_gain:      1.0
  init_goal_x:   0.0
  init_goal_y:   0.0
  init_goal_z:   1.0
  pilot_vw:      2.0
  pilot_vx:      2.0
  pilot_vy:      2.0
  pilot_vz:      1.0
  auto_pilot_vx: 1.0
  auto_pilot_vy: 1.0
  auto_pilot_vz: 0.8

astar:
  resolution:    0.15
  map_size_x:    30.0
  map_size_y:    15.0
  map_size_z:    8.0
  expand_dyn:    0.5
  expand_fix:    0.3
  update_dt:     5.0

rog_map:
  resolution: 0.15
  inflation_resolution: 0.15
  inflation_step: 5
  unk_inflation_en: true
  unk_inflation_step: 3
  map_size: [15, 25, 5]
  virtual_ceil_height: 999
  virtual_ground_height: -999
  block_inf_pt: false
  kd_tree_en: false
  safe_margin: 0.0
  load_pcd_en: false
  map_sliding:
    enable: true
    threshold: 0.1
  fix_map_origin: [0, 0, 0]
  frontier_extraction_en: false
  ros_callback:
    enable: false
    cloud_topic: "/pcl_render_node/cloud"
    odom_topic: "/CERLAB/quadcopter/odom_raw"
    odom_timeout: 2.0
  visulization:
    enbale: true
    time_rate: 10
    frame_rate: 0
    range: [8, 8, 3]
    frame_id: "world"
    pub_unknown_map_en: true
  intensity_thresh: -1
  point_filt_num: 1
  raycasting:
    enable: true
    blind_filter_en: false
    blind_filter_dis: 1.0
    batch_update_size: 1
    local_update_box: [8, 8, 5]
    ray_range: [0.1, 50]
    p_min: 0.12
    p_miss: 0.3
    p_free: 0.45
    p_occ: 0.6
    p_hit: 0.8
    p_max: 0.95
    inf_map_known_free_thresh: 1.0

mpc:
  horizon:  15
  step:     0.1
  R_p:      200.0
  R_v:      0.0
  R_a:      0.0
  R_u:      0.0
  R_u_con:  0.2
  R_pN:     200.0
  R_vN:     100.0
  R_aN:     100.0
  D_x:      0.0
  D_y:      0.0
  D_z:      0.0
  vx_min:  -3.0
  vy_min:  -3.0
  vz_min:  -3.0
  vx_max:   3.0
  vy_max:   3.0
  vz_max:   3.0
  ax_min:  -15.0
  ay_min:  -15.0
  az_min:  -10.0
  ax_max:   15.0
  ay_max:   15.0
  az_max:   15.0
  ux_min:  -50.0
  uy_min:  -50.0
  uz_min:  -50.0
  ux_max:   50.0
  uy_max:   50.0
  uz_max:   50.0
